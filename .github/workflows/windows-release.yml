name: Build Windows Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Standalone
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Build Standalone Executable with PyInstaller
        run: |
          python -m PyInstaller cutemix.spec --clean --noconfirm

      - name: Verify Executable Built
        run: |
          if (-not (Test-Path "dist\CuteMix.exe")) {
            Write-Error "dist\CuteMix.exe was not created!"
            exit 1
          }
          Write-Host "CuteMix.exe built successfully. File size: $((Get-Item 'dist\CuteMix.exe').Length / 1MB) MB"

      - name: Package Release ZIP
        run: |
          Compress-Archive -Path dist\CuteMix.exe, README.md, snapshots -DestinationPath dist\CuteMix-Windows-x64.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CuteMix-Windows-x64
          path: dist/CuteMix-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || inputs.release_tag }}
          name: CuteMix ${{ github.ref_name != 'main' && github.ref_name || inputs.release_tag }}
          body: |
            ## CuteMix Windows Standalone Release

            Pre-built standalone executable for **Windows (x64)** to manage MOTU PCIe-424 with 24i over OSC.

            ### What's Included:
            * `CuteMix.exe` — Standalone Windows GUI executable (no Python installation required).
            * `snapshots/` — Preset scenes (`default_unity.json`, `tracking_template.json`).
            * `README.md` — Full documentation and MOTU CueMix FX configuration guide.

            ### Quick Start on Windows:
            1. Download `CuteMix-Windows-x64.zip` below and extract it.
            2. Open **MOTU CueMix FX** and ensure OSC is enabled (`Control Surfaces > TouchOSC`).
            3. Run `CuteMix.exe`.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/CuteMix-Windows-x64.zip
            dist/CuteMix.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
